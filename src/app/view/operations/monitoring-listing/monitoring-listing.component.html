<div class="row align-items-center monitoring_page_list">
    <div class="col-sm-12">
        <div class="title-part">
            <h2>Monitoring</h2>
            <div class="upper_button">
                <!-- <button class="btn btn_create" (click)="viewaddmonitoring()"><i class="fa-solid fa-plus"></i>
                    {{buttonName==null? 'Create' : 'Update'}}</button> -->
                <button class="btn btn_create" (click)="createPopup()"><i class="fa-solid fa-plus"></i>
                    Create</button>

                <!-- <button class="btn back_btn_monitoring" (click)="backToViewPage()" >
                    <i class="fas fa-long-arrow-left"></i> Back</button> -->
            </div>
        </div>
    </div>



    <div class="col-sm-12 p_relative mt-2"><!----*ngIf="listingDiv==false"----->
        <div class="table-responsive listing-table">
            <table datatable [dtOptions]="dtOptions" [ngClass]="{ datatable_noRecord: jobList?.length != 0 }"
                class="table resize common-table mb-0" style="width: 100%">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Job Name</th>
                        <th>Job Status</th>
                        <th>Action Performed By</th>
                        <th>Action Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor=" let item of jobList ; let i=index">

                        <td>{{item.RN}}</td>
                        <td>{{item.JOB_NAME}}</td>
                        <td>{{item.STATUS}}</td>
                        <td>{{item.USER_NAME}}</td>
                        <td>{{item.CREATED_DATE | date:'YYYY-MM-dd HH:mm:ss'}}</td>
                        <td class="text-left action_td">
                            <table>
                                <tr>
                                    <td>
                                        <!-- <button title="View" (click)="viewStepsMonitoring(item.JOB_ID)"
                                            class="edit_green ml-0">
                                            <i class="fas fa-eye"></i>
                                        </button> -->
                                        <button title="View" (click)="viewStepsMonitoring(item.JOB_ID)"
                                            class="edit_green ml-0">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </td>
                                    <td>
                                        <!-- <button title="Edit" (click)="editStepsMonitoringPopup(item.JOB_ID)"
                                            class="edit_green ml-0" title="Edit">
                                            <i class="fa-solid fa-pencil"></i>
                                        </button> -->

                                        <button title="Edit" class="edit_green ml-0" title="Edit">
                                            <i class="fa-solid fa-pencil"></i>
                                        </button>

                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
