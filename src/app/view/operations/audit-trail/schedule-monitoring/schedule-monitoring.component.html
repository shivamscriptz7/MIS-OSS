<table datatable [dtOptions]="dtOptions" class="table resize common-table mb-0" style="width: 100%"
    [ngClass]="{ datatable_noRecord: scheduleList?.length != 0 }" *ngIf="listView">
    <thead>
        <tr>
            <th>S.No</th>
            <th>Action Performed By</th>
            <th>Log Action</th>
            <th>Schedule Name</th>
            <th>Action Date</th>
            <th>View</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor=" let item of scheduleList ; let i=index">
            <td>{{item.RN}}</td>
            <td title="{{item.USER_NAME}}">{{item.USER_NAME?.length>18? (item.USER_NAME |
                            slice:0:18)+'...':item.USER_NAME}}</td>
            <td><span
                    [ngClass]="item.SD_ACTION =='Update'? 'badge bg-success': item.SD_ACTION=='Insert' ? 'badge bg-primary':'badge bg-danger'">{{item.SD_ACTION}}</span>
            </td>

            <td title="{{item.SD_LOG_NAME}}">{{item.SD_LOG_NAME?.length>18? (item.SD_LOG_NAME |
                            slice:0:18)+'...':item.SD_LOG_NAME}}</td>
            <td>{{item.SD_CREATED_DATE}}</td>
            <td class="text-left action_td">
                <table>
                    <tr>
                        <td>
                            <button title="View" class="edit_green ml-0" (click)="dialogBox(item)">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </tbody>
</table>
