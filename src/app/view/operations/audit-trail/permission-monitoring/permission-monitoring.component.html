<table datatable [dtOptions]="dtOptions" class="table resize common-table mb-0" style="width: 100%"
    [ngClass]="{ datatable_noRecord: permiossionLogList?.length != 0 }" *ngIf="listView">
    <thead>
        <tr>
            <th>S.No</th>
            <th>Action Performed by</th>
            <th>Log Action</th>
            <th>Module Name</th>
            <!-- <th>Module Name</th> -->
            <th>Action Date</th>
            <th>View</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor=" let item of permiossionLogList ; let i=index">
            <td>{{item.RN}}</td>
            <td title="{{item.USER_NAME}}">{{item.USER_NAME?.length>18? (item.USER_NAME |
                            slice:0:18)+'...':item.USER_NAME}}</td>
            <td><span
                    [ngClass]="item.LOG_ACTION =='Update'? 'badge bg-success': item.LOG_ACTION=='Insert' ? 'badge bg-primary':'badge bg-danger'">{{item.LOG_ACTION}}</span>
            </td>
            <td title="{{item.MODULE_NAME}}">{{item.MODULE_NAME?.length>18? (item.MODULE_NAME |
                            slice:0:18)+'...':item.MODULE_NAME}}</td>
            <td>{{item.LOG_CREATED_DATE}}</td>
            <td class="text-left action_td">
                <table>
                    <tr>
                        <td *ngIf="item.MODULE_NAME=='TYPE PERMISSION'">
                            <button title="View" class="edit_green ml-0" (click)="dialogBoxType(item)">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </td>
                        <td *ngIf="item.MODULE_NAME=='ROLE PERMISSION'">
                            <button title="View" class="edit_green ml-0" (click)="dialogBoxRole(item)">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </tbody>
</table>
